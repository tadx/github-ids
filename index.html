<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sws-id</title>
<meta name="description" content="sws-id">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#0f0f10;--text:#e4e4e4;--muted:#85858a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(ellipse 45% 40% at 50% 46%,#1d1d1e 0%,#141415 55%,#0e0e0f 100%) fixed;background-color:var(--bg);color:var(--text);font-family:"Sora","Hiragino Sans","Noto Sans JP",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:12vh 20px calc(60px + env(safe-area-inset-bottom,0px));pointer-events:none}
main>*{pointer-events:auto}
h1{font-size:clamp(48px,7vw,58px);font-weight:600;letter-spacing:-.045em;line-height:1;margin:0 0 20px;color:#e2e2e2}
p{margin:0 0 20px;font-size:13px;letter-spacing:-.01em;color:var(--muted)}
.meta{display:flex;gap:6px 16px;flex-wrap:wrap;justify-content:center;margin:0 0 22px;font-size:12.5px;color:var(--muted)}
.meta b{font-weight:500;color:#b9b9bd}

/* glass + gradient outline (controls only) */
.glass{position:relative;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.012) 55%,rgba(255,255,255,.03) 100%);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 22px rgba(0,0,0,.45);transition:box-shadow .3s,background .3s,transform .15s}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.42),rgba(255,255,255,.07) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass:hover,.glass:focus-within{background:linear-gradient(180deg,rgba(255,255,255,.095),rgba(255,255,255,.025) 55%,rgba(255,255,255,.055));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 30px rgba(255,255,255,.10),0 6px 22px rgba(0,0,0,.45)}
.glass:hover::before,.glass:focus-within::before{background:conic-gradient(from var(--a),rgba(255,255,255,.95),rgba(150,170,255,.55) 18%,rgba(255,255,255,.06) 38%,rgba(255,200,230,.45) 62%,rgba(255,255,255,.06) 80%,rgba(255,255,255,.95));animation:spin 3.2s linear infinite}
@keyframes spin{to{--a:360deg}}

.bar{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:28px;width:100%;max-width:520px}
.search{flex:1 1 260px;height:48px;display:flex;align-items:center;padding:0 14px}
.search input{all:unset;width:100%;font:400 15px/1 "Sora",sans-serif;color:#e6e6e6;letter-spacing:-.01em}
.search input::placeholder{color:#6d6d72}
.btn{height:48px;padding:0 20px;border:0;cursor:pointer;color:#e6e6e6;font:500 15px/1 "Sora",sans-serif;letter-spacing:-.02em}
.btn:active{transform:scale(.98)}

.filters{position:relative;z-index:5;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:26px;width:100%;max-width:760px}
.seg{display:flex;padding:4px;gap:2px}
.seg button{all:unset;cursor:pointer;height:34px;padding:0 13px;border-radius:5px;font:500 13px/34px "Sora","Hiragino Sans",sans-serif;color:#8d8d91;transition:color .2s,background .2s}
.seg button:hover{color:#fff}
.seg button.on{color:#fff;background:rgba(255,255,255,.12)}
.dd{padding:4px}
.dd.open{z-index:30}
.dd-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border-radius:5px;font:500 13px/1 "Sora",sans-serif;color:#e6e6e6;white-space:nowrap}
.dd-btn:focus-visible{background:rgba(255,255,255,.08)}
.dd-btn .k{color:#76767a;font-weight:400}
.dd-btn svg{width:14px;height:14px;fill:none;stroke:#8d8d91;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-menu{position:absolute;left:0;top:calc(100% + 8px);min-width:100%;padding:5px;border-radius:8px;text-align:left;
  background:linear-gradient(180deg,rgba(40,40,43,.98),rgba(24,24,26,.98));
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);
  max-height:260px;overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s}
.dd.open .dd-menu{opacity:1;visibility:visible;transform:none}
.dd-opt{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;height:32px;padding:0 10px;border-radius:5px;cursor:pointer;font:500 13px/1 "Sora",sans-serif;color:#b9b9bd;white-space:nowrap}
.dd-opt:hover,.dd-opt:focus-visible{background:rgba(255,255,255,.09);color:#fff}
.dd-opt.on{color:#fff}
.dd-opt.on::after{content:"";width:6px;height:6px;border-radius:50%;background:#e6e6e6;box-shadow:0 0 8px rgba(255,255,255,.6)}
.dd-menu::-webkit-scrollbar{width:6px}
.dd-menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.hint{font-size:11.5px;color:#76767a;margin:-10px 0 20px}

/* lightweight tiles: no blur, no mask, no animation */
.grid{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.tile{position:relative;display:block;height:44px;line-height:44px;padding:0 10px;border-radius:8px;cursor:pointer;user-select:none;
  color:#d8d8da;font-size:15px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),inset 0 1px 0 rgba(255,255,255,.08);
  transition:background .15s,color .15s,box-shadow .15s}
.tile:hover,.tile:focus-visible{color:#fff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.16);outline:none}
.tile.copied{color:#9fe3b4;box-shadow:inset 0 0 0 1px rgba(159,227,180,.45)}
.tile .go{position:absolute;right:4px;top:4px;width:24px;height:36px;line-height:36px;color:#76767a;text-decoration:none;font-size:13px;opacity:0;transition:opacity .15s,color .15s}
.tile:hover .go,.tile:focus-within .go{opacity:1}
.tile .go:hover{color:#fff}
@media (hover:none){.tile .go{opacity:.6}}
#more{height:1px;width:100%}
.empty{color:var(--muted);font-size:13px;padding:30px 0}
#picker{display:none;margin-top:6px}
#picker.show{display:block}
#picker label{display:inline-flex;align-items:center;cursor:pointer}
#picker input{display:none}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <h1>sws-id</h1>
  <div class="meta" id="meta"><span id="status">Loading ids.txt…</span></div>
  <div class="bar">
    <div class="glass search"><input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false"></div>
    <button class="glass btn" id="copyAll" type="button">Copy all</button>
  </div>
  <div class="filters">
    <div class="glass seg" id="fDigit" role="group" aria-label="Digits">
      <button type="button" data-v="all" class="on">All</button>
      <button type="button" data-v="with">With digits</button>
      <button type="button" data-v="without">No digits</button>
    </div>
    <div class="glass dd" id="fMode"></div>
    <div class="glass dd" id="fLen"></div>
    <div class="glass dd" id="fSort"></div>
  </div>
  <div class="hint">Click a tile to copy &middot; &#8599; opens GitHub</div>
  <div id="picker"><p>Couldn't load ids.txt automatically (e.g. opened via file://).</p>
    <label class="glass btn"><input id="file" type="file" accept=".txt,text/plain">Choose ids.txt</label></div>
  <div class="grid" id="grid"></div>
  <div id="more"></div>
</main>
<script>
(function(){
  var items=[],shown=[],rendered=0,CHUNK=240,updated=null,flashT=0;
  var grid=document.getElementById('grid'),st=document.getElementById('status'),meta=document.getElementById('meta'),q=document.getElementById('q'),more=document.getElementById('more');
  var lastEl=null;

  /* ---------- data ---------- */
  function parse(text){
    var seen=Object.create(null),out=[];
    text.split(/\r?\n/).forEach(function(l){
      l=l.trim();
      if(!l)return;
      var lc=l.toLowerCase();
      if(seen[lc])return;
      seen[lc]=1;out.push({s:l,l:lc,d:/\d/.test(l)});
    });
    return out;
  }
  function two(n){return n<10?'0'+n:''+n}
  function fmtDate(d){return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())+' '+two(d.getHours())+':'+two(d.getMinutes())}
  function ago(d){
    var s=Math.max(0,(Date.now()-d.getTime())/1000);
    if(s<60)return 'just now';
    if(s<3600)return Math.floor(s/60)+'m ago';
    if(s<86400)return Math.floor(s/3600)+'h ago';
    if(s<86400*30)return Math.floor(s/86400)+'d ago';
    return Math.floor(s/86400/30)+'mo ago';
  }
  function setMeta(){
    var n=items.length,f=shown.length;
    var html='<span><b>'+(f!==n?f+' / ':'')+n+'</b> IDs</span>';
    if(updated&&!isNaN(updated))html+='<span>Last updated <b>'+fmtDate(updated)+'</b> ('+ago(updated)+')</span>';
    meta.innerHTML=html;
  }

  /* ---------- custom dropdown ---------- */
  var digit='all',openDD=null;
  function closeDD(){if(openDD){openDD.classList.remove('open');openDD=null}}
  document.addEventListener('pointerdown',function(e){if(openDD&&!openDD.contains(e.target))closeDD()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDD()});
  function makeDD(root,label,opts,val,cb){
    var btn=document.createElement('button'),menu=document.createElement('div'),api={};
    btn.type='button';btn.className='dd-btn';btn.setAttribute('aria-haspopup','listbox');
    menu.className='dd-menu';menu.setAttribute('role','listbox');
    root.appendChild(btn);root.appendChild(menu);
    function paint(){
      var cur=opts.filter(function(o){return o.v===val})[0]||opts[0];
      btn.innerHTML='<span class="k"></span><span class="v"></span><svg viewBox="0 0 16 16"><path d="M3 6l5 5 5-5"/></svg>';
      btn.firstChild.textContent=label;btn.childNodes[1].textContent=cur.t;
      menu.textContent='';
      opts.forEach(function(o){
        var b=document.createElement('button');
        b.type='button';b.className='dd-opt'+(o.v===val?' on':'');b.textContent=o.t;b.setAttribute('role','option');
        b.addEventListener('click',function(){val=o.v;closeDD();paint();cb(val);btn.focus()});
        menu.appendChild(b);
      });
    }
    btn.addEventListener('click',function(){
      if(openDD===root){closeDD();return}
      closeDD();root.classList.add('open');openDD=root;
    });
    api.get=function(){return val};
    api.setOpts=function(o){opts=o;if(!o.some(function(x){return x.v===val}))val=o[0].v;paint()};
    paint();
    return api;
  }
  var fMode=makeDD(document.getElementById('fMode'),'Match',[
    {v:'contains',t:'Contains'},{v:'starts',t:'Starts with'},{v:'ends',t:'Ends with'},{v:'exact',t:'Exact'}
  ],'contains',function(){render()});
  var fLen=makeDD(document.getElementById('fLen'),'Length',[{v:'',t:'Any'}],'',function(){render()});
  var fSort=makeDD(document.getElementById('fSort'),'Sort',[
    {v:'orig',t:'File order'},{v:'az',t:'A \u2192 Z'},{v:'za',t:'Z \u2192 A'}
  ],'orig',function(){render()});

  /* ---------- helpers ---------- */
  function copyText(t){
    var p=(navigator.clipboard&&window.isSecureContext)?navigator.clipboard.writeText(t):Promise.reject();
    return p.catch(function(){
      var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    });
  }
  function fillLens(){
    var set={};items.forEach(function(x){set[x.s.length]=1});
    var o=[{v:'',t:'Any'}];
    Object.keys(set).map(Number).sort(function(a,b){return a-b}).forEach(function(n){
      o.push({v:String(n),t:n+(n===1?' char':' chars')});
    });
    fLen.setOpts(o);
  }
  function match(x,k,m){
    if(!k)return true;
    var l=x.l;
    if(m==='starts')return l.indexOf(k)===0;
    if(m==='ends')return l.length>=k.length&&l.slice(-k.length)===k;
    if(m==='exact')return l===k;
    return l.indexOf(k)>-1;
  }

  /* ---------- rendering (chunked, so 1000s of IDs stay light) ---------- */
  function tile(id){
    var d=document.createElement('div');
    d.className='tile';d.textContent=id;d.tabIndex=0;d.setAttribute('role','button');d.title='Click to copy';
    var go=document.createElement('a');
    go.className='go';go.textContent='\u2197';go.title='Open on GitHub';
    go.href='https://github.com/'+encodeURIComponent(id);
    go.target='_blank';go.rel='noopener noreferrer';
    d.appendChild(go);
    return d;
  }
  function renderMore(){
    if(rendered>=shown.length)return;
    var end=Math.min(shown.length,rendered+CHUNK),f=document.createDocumentFragment();
    for(var i=rendered;i<end;i++)f.appendChild(tile(shown[i].s));
    grid.appendChild(f);rendered=end;
  }
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){
    if(es[0].isIntersecting)renderMore();
  },{rootMargin:'1200px 0px'}):null;
  if(io)io.observe(more);else addEventListener('scroll',function(){
    if(innerHeight+scrollY>document.body.scrollHeight-1500)renderMore();
  },{passive:true});

  function render(){
    var k=q.value.trim().toLowerCase(),m=fMode.get(),len=+fLen.get()||0,s=fSort.get();
    shown=items.filter(function(x){
      if(digit==='with'&&!x.d)return false;
      if(digit==='without'&&x.d)return false;
      if(len&&x.s.length!==len)return false;
      return match(x,k,m);
    });
    if(s==='az')shown=shown.slice().sort(function(a,b){return a.l<b.l?-1:a.l>b.l?1:0});
    if(s==='za')shown=shown.slice().sort(function(a,b){return a.l<b.l?1:a.l>b.l?-1:0});
    grid.textContent='';rendered=0;
    if(!shown.length){var e=document.createElement('div');e.className='empty';e.textContent='No results';grid.appendChild(e)}
    else{renderMore();if(io){io.unobserve(more);io.observe(more)}}
    setMeta();
  }
  function load(text,lm){
    items=parse(text);
    if(lm)updated=lm;
    document.getElementById('picker').classList.remove('show');
    fillLens();render();
  }

  /* ---------- events ---------- */
  var qt=0;
  q.addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(render,120)});
  document.getElementById('fDigit').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    digit=b.getAttribute('data-v');
    Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('on',c===b)});
    render();
  });
  grid.addEventListener('click',function(e){
    if(e.target.closest('.go'))return;
    var t=e.target.closest('.tile');if(!t)return;
    var id=t.firstChild.textContent;
    copyText(id).then(function(){
      if(lastEl)lastEl.classList.remove('copied');
      lastEl=t;t.classList.add('copied');
      st.textContent='Copied: '+id;
      clearTimeout(flashT);
      flashT=setTimeout(function(){t.classList.remove('copied');setMeta()},1100);
    });
  });
  grid.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var t=e.target.closest('.tile');if(!t||e.target!==t)return;
    e.preventDefault();t.click();
  });
  document.getElementById('copyAll').addEventListener('click',function(){
    var b=this;
    copyText(shown.map(function(x){return x.s}).join('\n')).then(function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy all'},1200)});
  });
  document.getElementById('file').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){load(r.result,new Date(f.lastModified))};r.readAsText(f);
  });
  setInterval(function(){if(!document.hidden&&updated&&!lastEl)setMeta()},60000);

  fetch('ids.txt',{cache:'no-cache'}).then(function(r){
    if(!r.ok)throw 0;
    var h=r.headers.get('last-modified');
    return r.text().then(function(t){load(t,h?new Date(h):(document.lastModified?new Date(document.lastModified):null))});
  }).catch(function(){
    meta.innerHTML='<span>ids.txt could not be loaded</span>';
    document.getElementById('picker').classList.add('show');
  });

  /* ---------- background: same look, much cheaper ---------- */
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var W,H,dpr,GAP=14,cols,rows,ripples=[],t0=performance.now(),last=0,running=true;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    GAP=Math.max(14,Math.round(Math.sqrt(W*H/6500)));
    cols=Math.ceil(W/GAP)+2;rows=Math.ceil(H/GAP)+2;
  }
  addEventListener('resize',resize);resize();
  function add(x,y){ripples.push({x:x,y:y,t:performance.now()})}
  addEventListener('pointerdown',function(e){add(e.clientX,e.clientY)});
  setTimeout(function(){add(innerWidth/2,innerHeight/2-40)},300);
  var SPEED=150,WIDTH=64,LIFE=1500,FRAME=1000/30;
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden||now-last<FRAME)return;
    last=now;
    var t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);
    ripples=ripples.filter(function(r){return now-r.t<LIFE});
    var cx=W/2,cy=H/2-40,maxd=Math.hypot(W,H)/2,nr=ripples.length;
    for(var j=0;j<rows;j++){
      for(var i=0;i<cols;i++){
        var bx=i*GAP-GAP/2,by=j*GAP-GAP/2;
        var fx=reduce?0:Math.sin(by*.012+t*.6)*3.5+Math.sin((bx+by)*.008-t*.45)*3;
        var fy=reduce?0:Math.cos(bx*.011+t*.5)*3.5+Math.cos((bx-by)*.007+t*.35)*3;
        var x=bx+fx,y=by+fy;
        var d=Math.hypot(bx-cx,by-cy)/maxd;
        var band=.5+.5*Math.sin(d*6.5-t*.3+Math.sin(bx*.0035+by*.002+t*.18)*2.2);
        var base=.015+.26*Math.pow(band,2.6)*Math.min(1,Math.max(0,d-.12)*3)*(1-Math.max(0,d-.85)*3);
        if(base<.015)base=.015;
        var glow=0;
        for(var k=0;k<nr;k++){
          var r=ripples[k],rad=(now-r.t)/1000*SPEED;
          var dist=Math.hypot(x-r.x,y-r.y),diff=dist-rad;
          var fade=1-(now-r.t)/LIFE;
          var env=Math.exp(-(diff*diff)/(2*WIDTH*WIDTH/4))*fade;
          var diff2=dist-(rad-40),env2=Math.exp(-(diff2*diff2)/(2*WIDTH*WIDTH/4))*fade*.45;
          glow+=env+env2;
          if(dist>.1&&env>.02){x+=(x-r.x)/dist*env*2.5;y+=(y-r.y)/dist*env*2.5}
        }
        var a=Math.min(.75,base+glow*.5);
        ctx.fillStyle='rgba(205,205,210,'+a.toFixed(2)+')';
        if(glow>.05){
          ctx.beginPath();ctx.arc(x,y,.65+Math.min(glow,1.2)*.7,0,6.2832);ctx.fill();
        }else{
          ctx.fillRect(x-.65,y-.65,1.3,1.3);
        }
      }
    }
    for(var m=0;m<nr;m++){
      var qq=ripples[m],rr=(now-qq.t)/1000*SPEED,f=1-(now-qq.t)/LIFE;
      ctx.strokeStyle='rgba(255,255,255,'+(.04*f*f).toFixed(3)+')';
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(qq.x,qq.y,rr,0,6.2832);ctx.stroke();
      var g=ctx.createRadialGradient(qq.x,qq.y,0,qq.x,qq.y,rr+60);
      g.addColorStop(0,'rgba(255,255,255,'+(.06*f*f).toFixed(3)+')');g.addColorStop(.6,'rgba(255,255,255,'+(.02*f*f).toFixed(3)+')');g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
